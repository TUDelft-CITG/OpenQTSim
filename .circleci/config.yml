version: 2.1
jobs:
  build:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build and start container
          command: docker compose up -d

      - run:
          name: Install test and documentation dependencies
          command: |
            docker exec openqtsim python -m pip install -e ".[testing,dask]" -r docs/requirements.txt coverage-badge
      
      - run:
          name: Run tests
          command: |
            mkdir -p /tmp/artifacts
            docker exec openqtsim python -m pytest
            docker cp openqtsim:/OpenQTSim/htmlcov /tmp/artifacts
      
      - run:
          name: Build docs
          command: |
            docker exec openqtsim python -m sphinx -b html -n -W --keep-going docs docs/_build/html
            docker cp openqtsim:/OpenQTSim/docs/_build/html /tmp/artifacts/docs
      
      - run:
          name: Generate coverage badge
          command: |
            docker exec openqtsim coverage-badge -o coverage.svg
            docker cp openqtsim:/OpenQTSim/coverage.svg /tmp/artifacts/
      
      - store_artifacts:
          path: /tmp/artifacts

workflows:
  version: 2
  build:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/